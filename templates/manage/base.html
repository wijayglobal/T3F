{% extends "base.html" %}
{% block title %}Admin · கலைச்சொல்{% endblock %}
{% block content %}
<h1 class="sr-only">Admin</h1>
{% with here=request.resolver_match.url_name %}
<nav class="tabs" aria-label="Admin sections">
  <a class="{% if here == 'manage' %}on{% endif %}" href="{% url 'lexicon:manage' %}"{% if here == 'manage' %} aria-current="page"{% endif %}>Overview</a>
  <a class="{% if here == 'manage_users' %}on{% endif %}" href="{% url 'lexicon:manage_users' %}"{% if here == 'manage_users' %} aria-current="page"{% endif %}>Users</a>
  <a class="{% if here == 'manage_words' %}on{% endif %}" href="{% url 'lexicon:manage_words' %}"{% if here == 'manage_words' %} aria-current="page"{% endif %}>Add words</a>
  <a class="{% if here == 'manage_reports' %}on{% endif %}" href="{% url 'lexicon:manage_reports' %}"{% if here == 'manage_reports' %} aria-current="page"{% endif %}>Reports</a>
  <a href="{% url 'lexicon:review' %}?kind=pending">Review queue</a>
  <a href="{% url 'admin:index' %}">Django admin</a>
</nav>
{% endwith %}
{% block manage %}{% endblock %}
{% endblock %}
